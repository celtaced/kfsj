openapi: 3.0.3
info:
  title: API de E-commerce
  version: 1.0.0
  description: |
    API Laravel 12. Los importes se expresan en centavos de USD.
    Registre un usuario o inicie sesion y use el token Bearer para las rutas protegidas.
    Crear, modificar o eliminar productos requiere una cuenta administradora.
    Las tarjetas se procesan con Stripe.js; esta API no recibe datos de tarjetas.
servers:
  - url: /
tags:
  - name: Autenticacion
  - name: Productos
  - name: Ordenes
  - name: Pagos
paths:
  /api/register:
    post:
      tags: [Autenticacion]
      summary: Registrar cliente y obtener token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Register' }
      responses:
        '201':
          description: Cliente registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/Throttle' }
  /api/login:
    post:
      tags: [Autenticacion]
      summary: Iniciar sesion y obtener token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200':
          description: Autenticacion correcta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/Throttle' }
  /api/logout:
    post:
      tags: [Autenticacion]
      summary: Revocar el token actual
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/products:
    get:
      tags: [Productos]
      summary: Listar productos activos
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
    post:
      tags: [Productos]
      summary: Crear producto
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/products/{product}:
    parameters:
      - name: product
        in: path
        required: true
        schema: { type: integer, example: 1 }
    get:
      tags: [Productos]
      summary: Consultar producto activo
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Productos]
      summary: Actualizar producto
      description: Se aceptan los campos presentes; los omitidos conservan su valor.
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: '#/components/requestBodies/ProductUpdate'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    patch:
      tags: [Productos]
      summary: Actualizar parcialmente producto
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: '#/components/requestBodies/ProductUpdate'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Productos]
      summary: Eliminar producto
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orders:
    get:
      tags: [Ordenes]
      summary: Historial de ordenes del cliente autenticado
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Historial paginado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Ordenes]
      summary: Crear orden con precios calculados por el servidor
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201':
          description: Orden pendiente creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/orders/{order}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Ordenes]
      summary: Consultar una orden propia
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Detalle de la orden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orders/{order}/payment-intent:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Pagos]
      summary: Crear o recuperar PaymentIntent de una orden propia
      description: El cliente usa client_secret con Stripe.js. El webhook confirma el estado final.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: PaymentIntent disponible
          content:
            application/json:
              schema:
                type: object
                required: [payment_id, client_secret]
                properties:
                  payment_id: { type: integer, example: 1 }
                  client_secret: { type: string, example: pi_example_secret_example }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/stripe/webhook:
    post:
      tags: [Pagos]
      summary: Recibir eventos firmados de Stripe
      description: Verifica la firma Stripe-Signature; procesa payment_intent.succeeded y payment_intent.payment_failed.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, example: evt_example }
                type: { type: string, example: payment_intent.succeeded }
                data: { type: object }
      responses:
        '200':
          description: Evento recibido
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, example: 1 }
    OrderId:
      name: order
      in: path
      required: true
      schema: { type: integer, example: 1 }
  requestBodies:
    ProductUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductFields' }
  schemas:
    Error:
      type: object
      properties:
        message: { type: string, example: Solicitud invalida. }
    ValidationError:
      type: object
      properties:
        message: { type: string, example: El campo email es obligatorio. }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          example: { email: ['El campo email es obligatorio.'] }
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Ana }
        email: { type: string, format: email, example: ana@example.com }
        is_admin: { type: boolean, example: false }
    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string, example: 1|exampletoken }
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: ana@example.com }
        password: { type: string, format: password, example: Ejemplo123 }
    Register:
      allOf:
        - { $ref: '#/components/schemas/Login' }
        - type: object
          required: [name, password_confirmation]
          properties:
            name: { type: string, example: Ana }
            password_confirmation: { type: string, format: password, example: Ejemplo123 }
    ProductFields:
      type: object
      properties:
        name: { type: string, maxLength: 255, example: Mochila }
        description: { type: string, maxLength: 5000, example: Mochila para uso diario }
        price_cents: { type: integer, minimum: 50, maximum: 1000000, example: 3500 }
        active: { type: boolean, example: true }
    ProductInput:
      allOf:
        - { $ref: '#/components/schemas/ProductFields' }
        - type: object
          required: [name, description, price_cents]
    Product:
      allOf:
        - { $ref: '#/components/schemas/ProductFields' }
        - type: object
          properties:
            id: { type: integer, example: 1 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    OrderInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: integer, example: 1 }
              quantity: { type: integer, minimum: 1, maximum: 100, example: 2 }
    OrderItem:
      type: object
      properties:
        id: { type: integer, example: 1 }
        product_id: { type: integer, nullable: true, example: 1 }
        product_name: { type: string, example: Mochila }
        unit_price_cents: { type: integer, example: 3500 }
        quantity: { type: integer, example: 2 }
    Payment:
      type: object
      nullable: true
      properties:
        id: { type: integer, example: 1 }
        order_id: { type: integer, example: 1 }
        stripe_payment_intent_id: { type: string, nullable: true, example: pi_example }
        amount_cents: { type: integer, example: 7000 }
        currency: { type: string, example: usd }
        status: { type: string, enum: [pending, succeeded, failed] }
        failure_code: { type: string, nullable: true }
    Order:
      type: object
      properties:
        id: { type: integer, example: 1 }
        uuid: { type: string, format: uuid }
        user_id: { type: integer, example: 1 }
        total_cents: { type: integer, example: 7000 }
        currency: { type: string, example: usd }
        status: { type: string, enum: [pending, payment_failed, paid] }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        payment: { $ref: '#/components/schemas/Payment' }
    Pagination:
      type: object
      properties:
        current_page: { type: integer, example: 1 }
        per_page: { type: integer, example: 20 }
        total: { type: integer, example: 1 }
    ProductPage:
      allOf:
        - { $ref: '#/components/schemas/Pagination' }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Product' }
    OrderPage:
      allOf:
        - { $ref: '#/components/schemas/Pagination' }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Order' }
  responses:
    Error:
      description: Error de procesamiento
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Token ausente o invalido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Unauthenticated. }
    NotFound:
      description: Recurso inexistente o no perteneciente al usuario
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Not Found. }
    Forbidden:
      description: Se requiere una cuenta administradora
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Se requiere una cuenta administradora. }
    Validation:
      description: Error de validacion
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    Throttle:
      description: Demasiados intentos; espere antes de reintentar
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Message:
      description: Operacion realizada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Operacion completada. }
